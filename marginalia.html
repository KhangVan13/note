<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marginalia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap">
<style>
:root{--bg:#E6ECF1;--panel:#F5F8FA;--paper:#fff;--ink:#17222D;--muted:#5B6B7A;--line:#CDD7DF;--accent:#2347C5;--on:#fff;--mark:#FFE45C;--ok:#1E7A4C;--bad:#B3352B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E151B;--panel:#151E26;--paper:#1B2630;--ink:#E6EDF3;--muted:#93A4B3;--line:#2A3844;--accent:#8CA6FF;--on:#0E151B;--ok:#58C08A;--bad:#FF8B80}}
:root[data-theme="dark"]{--bg:#0E151B;--panel:#151E26;--paper:#1B2630;--ink:#E6EDF3;--muted:#93A4B3;--line:#2A3844;--accent:#8CA6FF;--on:#0E151B;--ok:#58C08A;--bad:#FF8B80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,sans-serif;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{display:grid;grid-template-columns:230px minmax(0,1fr) 340px;height:100%}
.side,.ai{background:var(--panel);overflow:auto;padding:14px;min-height:0}
.side{border-right:1px solid var(--line)}.ai{border-left:1px solid var(--line)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.brand{font:600 20px Newsreader,Georgia,serif;margin:0 0 12px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;min-height:36px}
.btn.pri{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.55;cursor:wait}
.btn.wide{width:100%}
.nlist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px}
.nrow{display:flex;gap:4px}
.nrow .open{flex:1;text-align:left;background:none;border:0;border-radius:8px;padding:8px;min-width:0}
.nrow .open b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .open span{color:var(--muted);font-size:12px}
.nrow.on .open{background:var(--paper);outline:1px solid var(--line)}
.nrow .del{background:none;border:0;color:var(--muted);border-radius:8px;padding:0 8px}
.nrow .del.arm{color:var(--bad);font-weight:600}
.bar{display:flex;gap:3px;align-items:center;overflow-x:auto;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.bar button,.bar select{flex:none;min-width:34px;height:34px;border:1px solid transparent;background:none;border-radius:6px;padding:0 8px}
.bar button:hover,.bar select:hover{background:var(--paper);border-color:var(--line)}
.bar .sep{flex:none;width:1px;height:20px;background:var(--line);margin:0 4px}
.bar .txt{font-weight:600;color:var(--accent)}
.scroll{overflow:auto;flex:1;min-height:0}
.sheet{background:var(--paper);max-width:780px;margin:18px auto;padding:34px 46px 60px;border:1px solid var(--line);border-radius:4px;min-height:calc(100% - 36px);box-sizing:border-box}
#title{width:100%;border:0;background:none;outline:0;font:600 32px/1.2 Newsreader,Georgia,serif;margin:0 0 14px;padding:0}
#page{outline:0;font:18px/1.65 Newsreader,Georgia,serif;min-height:50vh;overflow-wrap:anywhere}
#page h1,#page h2,#page h3{font-family:Figtree,system-ui,sans-serif;line-height:1.25;margin:1.2em 0 .4em}
#page h1{font-size:27px}#page h2{font-size:21px}#page h3{font-size:17px}
#page p{margin:0 0 .7em}
#page mark,#page [style*="background"]{background:var(--mark);color:#17222D;border-radius:2px}
#page img{max-width:100%;border-radius:6px;border:1px solid var(--line);background:#fff;display:block;margin:8px 0}
#page table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%}
#page td,#page th{border:1px solid var(--line);padding:6px 10px;text-align:left}
.syncs{font-size:12px;color:var(--muted);margin:-6px 0 10px}
.fld{border:0;background:none;color:var(--muted);font:13px Figtree,sans-serif;margin:0 0 6px;padding:0;width:100%;outline:0}
#q{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:36px;width:100%;box-sizing:border-box;margin:10px 0 0}
#fold{margin-top:8px}
#page.lined{line-height:32px;background:repeating-linear-gradient(transparent 0 31px,color-mix(in srgb,var(--accent) 20%,transparent) 31px 32px) local}
#page.grid{background:linear-gradient(color-mix(in srgb,var(--accent) 16%,transparent) 1px,transparent 1px) 0 0/24px 24px local,linear-gradient(90deg,color-mix(in srgb,var(--accent) 16%,transparent) 1px,transparent 1px) 0 0/24px 24px local}
#page.dot{background:radial-gradient(circle,color-mix(in srgb,var(--accent) 45%,transparent) 1px,transparent 1.5px) 0 0/24px 24px local}
#cv.grid{background:linear-gradient(color-mix(in srgb,var(--accent) 16%,transparent) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,color-mix(in srgb,var(--accent) 16%,transparent) 1px,transparent 1px) 0 0/24px 24px,#fff}
#cv.dot{background:radial-gradient(circle,color-mix(in srgb,var(--accent) 45%,transparent) 1px,transparent 1.5px) 0 0/24px 24px,#fff}
#cv.plain{background:#fff}
.sec{margin:0 0 22px}
.sec h2{font:600 16px Figtree,sans-serif;margin:0 0 8px}
.sec p{margin:0 0 10px;color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1;min-width:0}
select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:36px;width:100%;box-sizing:border-box}
label.chk{display:flex;gap:8px;align-items:center;margin:4px 0 10px;font-size:14px}
.q{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.q .qt{font-weight:600;margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:none;border-radius:8px;padding:8px 10px;margin:4px 0}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.why{margin:8px 0 0;font-size:14px;color:var(--muted)}
.score{position:sticky;top:-14px;background:var(--panel);padding:8px 0;font-weight:600;z-index:1}
.tabs{display:none}
.modal{position:fixed;inset:0;background:rgba(8,14,20,.6);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.modal[hidden]{display:none}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;width:min(760px,100%);max-height:100%;overflow:auto;box-sizing:border-box}
#cv{display:block;width:100%;height:min(54vh,460px);touch-action:none;border:1px solid var(--line);border-radius:8px;background:repeating-linear-gradient(transparent 0 31px,color-mix(in srgb,var(--accent) 22%,transparent) 31px 32px),#fff}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:8px;max-width:88vw;z-index:9}
#toast[hidden]{display:none}
@media(max-width:899px){
.app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
.app>.side,.app>.main,.app>.ai{display:none;grid-row:1;border:0}
.app[data-view=notes]>.side,.app[data-view=ai]>.ai{display:block}
.app[data-view=write]>.main{display:flex}
.tabs{display:flex;grid-row:2;background:var(--panel);border-top:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:12px 0;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed=true]{color:var(--accent);box-shadow:inset 0 2px var(--accent)}
.sheet{margin:0;border:0;border-radius:0;padding:22px 18px 60px;min-height:100%}
#title{font-size:26px}
}
</style></head>
<body>
<div class="app" id="app" data-view="write">
<aside class="side">
 <h1 class="brand">Marginalia</h1>
 <p class="syncs" id="sync" role="status"></p>
 <button class="btn pri wide" id="newNote">New note</button>
 <input id="q" type="search" placeholder="Search notes" aria-label="Search notes">
 <select id="fold" aria-label="Notebook filter"><option value="">All notebooks</option></select>
 <ul class="nlist" id="list"></ul>
</aside>
<main class="main">
 <div class="bar" id="bar" role="toolbar" aria-label="Formatting"></div>
 <div class="scroll"><div class="sheet">
  <input id="folder" class="fld" list="flist" placeholder="Add to a notebook" aria-label="Notebook"><datalist id="flist"></datalist>
  <input id="title" placeholder="Untitled" aria-label="Note title">
  <div id="page" contenteditable="true" spellcheck="true" aria-label="Note body"></div>
 </div></div>
</main>
<aside class="ai">
 <section class="sec">
  <h2>Format this note</h2>
  <p>Fixes spelling, adds headings and lists, highlights the testable points. Your facts stay as written.</p>
  <select id="fmode" aria-label="Format style"><option value="tidy">Tidy up</option><option value="outline">Outline</option><option value="sheet">Study sheet</option></select>
  <div class="row" style="margin-top:8px"><button class="btn pri" id="fmt">Format with AI</button><button class="btn" id="undoAi" hidden>Undo AI</button></div>
 </section>
 <section class="sec">
  <h2>Practice exam</h2>
  <p>Questions come only from your notes.</p>
  <div class="row"><select id="ecount" aria-label="Question count"><option>5</option><option selected>8</option><option>12</option><option>20</option></select>
  <select id="etype" aria-label="Question type"><option value="mixed">Mixed</option><option value="mcq">Multiple choice</option><option value="short">Short answer</option></select></div>
  <select id="ediff" aria-label="Difficulty"><option value="recall">Recall</option><option value="application" selected>Application</option><option value="hard">Hard, multi-step</option></select>
  <label class="chk"><input type="checkbox" id="allnotes"> Use all my notes</label>
  <button class="btn pri wide" id="gen">Generate exam</button>
  <div id="exam"></div>
 </section>
 <section class="sec">
  <h2>Flashcards</h2>
  <p>Flip a card, then mark what you knew. Missed cards come back.</p>
  <button class="btn pri wide" id="fgen">Make flashcards</button>
  <div id="deck"></div>
 </section>
</aside>
<nav class="tabs" aria-label="Sections">
 <button data-v="notes" aria-pressed="false">Notes</button>
 <button data-v="write" aria-pressed="true">Write</button>
 <button data-v="ai" aria-pressed="false">AI tools</button>
</nav>
</div>

<div class="modal" id="draw" hidden>
 <div class="pane" role="dialog" aria-label="Handwriting">
  <canvas id="cv"></canvas>
  <div class="tools">
   <button class="sw on" data-c="#17222D" style="background:#17222D" aria-label="Black pen"></button>
   <button class="sw" data-c="#2347C5" style="background:#2347C5" aria-label="Blue pen"></button>
   <button class="sw" data-c="#C23B2E" style="background:#C23B2E" aria-label="Red pen"></button>
   <button class="sw" data-c="#FFD60A" style="background:#FFD60A" aria-label="Yellow"></button>
   <button class="btn" id="eraser" aria-pressed="false">Eraser</button>
   <button class="btn" id="hl" aria-pressed="false">Highlighter</button>
   <input type="range" id="psize" min="1" max="12" value="3" aria-label="Pen size" style="width:90px">
   <select id="ptpl" aria-label="Paper" style="width:auto"><option value="lined">Lined</option><option value="grid">Grid</option><option value="dot">Dots</option><option value="plain">Plain</option></select>
   <button class="btn" id="dundo">Undo</button>
   <button class="btn" id="dclear">Clear</button>
  </div>
  <div class="tools">
   <button class="btn pri" id="dins">Insert drawing</button>
   <button class="btn pri" id="dtr">Convert to text</button>
   <button class="btn" id="dclose">Close</button>
  </div>
 </div>
</div>
<input type="file" id="photo" accept="image/*" hidden>
<input type="file" id="imgfile" accept="image/*" hidden>
<div id="toast" hidden role="status"></div>

<script>
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='marginalia.notes.v1';
const WELCOME='<h2>Welcome to Marginalia</h2><p>Type here like a normal document. Use the toolbar for headings, bold, highlights and lists.</p><ul><li>Draw: write by hand with a finger or stylus, then insert it or convert it to text.</li><li>Scan photo: turn a photo of paper notes into editable text.</li><li>AI tools: tidy this note, then generate a practice exam from it.</li></ul>';
let notes=[],cur=null,t=null,sample=null,canImg=false,prevHTML=null,savedRange=null,exam=[];

function load(){
 try{notes=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){notes=[]}
 if(!Array.isArray(notes)||!notes.length)notes=[{id:'welcome',title:'Welcome',html:WELCOME,updated:0}];
 cur=notes[0].id;
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){toast('Storage is full. Delete a note or drawing to keep saving.')}}
const get=()=>notes.find(n=>n.id===cur);
function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3600)}
function view(v){$('#app').dataset.view=v;document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v))}

function list(){
 const ul=$('#list');ul.innerHTML='';
 folders();[...notes].filter(vis).sort((a,b)=>b.updated-a.updated).forEach(n=>{
  const li=document.createElement('li');li.className='nrow'+(n.id===cur?' on':'');
  const d=n.updated?new Date(n.updated).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';
  li.innerHTML='<button class="open"><b>'+esc(n.title||'Untitled')+'</b><span>'+d+'</span></button><button class="del" aria-label="Delete note">Delete</button>';
  li.querySelector('.open').onclick=()=>{openNote(n.id);view('write')};
  const del=li.querySelector('.del');
  del.onclick=()=>{
   if(!del.classList.contains('arm')){del.classList.add('arm');del.textContent='Sure?';setTimeout(()=>{del.classList.remove('arm');del.textContent='Delete'},2500);return}
   notes=notes.filter(x=>x.id!==n.id);if(col)col.doc(n.id).delete().catch(()=>{});
   if(!notes.length)notes=[{id:uid(),title:'',html:'',updated:Date.now()}];
   if(cur===n.id)cur=notes[0].id;
   persist();openNote(cur);
  };
  ul.appendChild(li);
 });
}
function openNote(id){cur=id;const n=get();$('#title').value=n.title;$('#page').innerHTML=n.html;$('#folder').value=n.folder||'';applyPaper();prevHTML=null;$('#undoAi').hidden=true;list()}
function onEdit(){
 const n=get();n.html=$('#page').innerHTML;n.title=$('#title').value;n.updated=Date.now();
 clearTimeout(t);t=setTimeout(()=>{persist();list()},400);push(n.id);
}
$('#page').addEventListener('input',onEdit);
$('#title').addEventListener('input',onEdit);
$('#newNote').onclick=()=>{const n={id:uid(),title:'',html:'',updated:Date.now(),folder:$('#fold').value};notes.unshift(n);persist();openNote(n.id);view('write');$('#title').focus()};

/* selection tracking */
document.addEventListener('selectionchange',()=>{
 const s=getSelection();
 if(s.rangeCount&&$('#page').contains(s.anchorNode))savedRange=s.getRangeAt(0).cloneRange();
});
function restore(){
 const p=$('#page');p.focus();const s=getSelection();s.removeAllRanges();
 if(savedRange&&p.contains(savedRange.startContainer))s.addRange(savedRange);
 else{const r=document.createRange();r.selectNodeContents(p);r.collapse(false);s.addRange(r)}
}
function insertHTML(h){restore();document.execCommand('insertHTML',false,h);onEdit()}

/* toolbar */
const alignIcon=a=>'<svg width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">'+[16,10,14].map((w,i)=>{const o=a==='left'?0:a==='right'?16-w:(16-w)/2;return '<path d="M'+o+' '+(2+i*5)+'h'+w+'"/>'}).join('')+'</svg>';
const TOOLS=[
 ['<b>B</b>','bold','','Bold'],['<i>I</i>','italic','','Italic'],['<u>U</u>','underline','','Underline'],['<s>S</s>','strikeThrough','','Strikethrough'],
 ['<span style="background:var(--mark);color:#17222D;padding:0 4px;border-radius:2px">Hi</span>','hl','','Highlight'],'|',
 ['&bull;','insertUnorderedList','','Bulleted list'],['1.','insertOrderedList','','Numbered list'],'|',
 [alignIcon('left'),'justifyLeft','','Align left'],[alignIcon('center'),'justifyCenter','','Center'],[alignIcon('right'),'justifyRight','','Align right'],'|',
 ['Undo','undo','','Undo'],['Redo','redo','','Redo'],['Clear','removeFormat','','Clear formatting'],'|',
 ['Image','img','','Insert an image','txt'],['Draw','draw','','Write by hand','txt'],['Scan photo','scan','','Turn a photo of paper notes into text','txt']
];
(function(){
 const bar=$('#bar');
 const sel=document.createElement('select');sel.setAttribute('aria-label','Text style');
 sel.innerHTML='<option value="p">Normal</option><option value="h1">Title</option><option value="h2">Heading</option><option value="h3">Subheading</option>';
 sel.onchange=()=>{restore();document.execCommand('formatBlock',false,'<'+sel.value+'>');onEdit()};
 bar.appendChild(sel);
 const pp=document.createElement('select');pp.id='paper';pp.setAttribute('aria-label','Page paper');pp.innerHTML='<option value="">Plain</option><option value="lined">Lined</option><option value="grid">Grid</option><option value="dot">Dots</option>';pp.onchange=()=>{get().paper=pp.value;applyPaper();onEdit()};bar.appendChild(pp);
 TOOLS.forEach(x=>{
  if(x==='|'){const s=document.createElement('span');s.className='sep';bar.appendChild(s);return}
  const b=document.createElement('button');b.innerHTML=x[0];b.title=x[3];b.setAttribute('aria-label',x[3]);if(x[4])b.className=x[4];
  b.onclick=()=>run(x[1],x[2]);bar.appendChild(b);
 });
 bar.addEventListener('mousedown',e=>{if(e.target.closest('button'))e.preventDefault()});
})();
function run(cmd,val){
 if(cmd==='draw')return openDraw();
 if(cmd==='scan')return $('#photo').click();
 if(cmd==='img')return $('#imgfile').click();
 restore();document.execCommand('styleWithCSS',false,true);
 if(cmd==='hl'){
  const on=/255,\s*228,\s*92/.test(document.queryCommandValue('hiliteColor'));
  document.execCommand('hiliteColor',false,on?'transparent':'#FFE45C');
 }else document.execCommand(cmd,false,val||null);
 onEdit();
}

/* AI plumbing */
async function ai(){
 if(sample)return sample;
 try{sample=window.claude?await window.claude.use('sample'):null}catch(e){sample=null}
 if(!sample){toast('AI tools are not available in this view. Open the published page in Claude.');return null}
 try{canImg=!!(await sample.limits()).images}catch(e){canImg=false}
 return sample;
}
async function busy(btn,label,fn){
 const old=btn.textContent;btn.disabled=true;btn.textContent=label;
 try{await fn()}catch(e){
  if(e&&e.code==='not_granted')toast('AI access was declined. Allow it from the page permissions to use this.');
  else if(e&&e.code==='rate_limited')toast('Too many requests. Wait a moment and try again.');
  else toast('That did not work. Try again in a moment.');
 }
 btn.disabled=false;btn.textContent=old;
}
const OK=new Set('H1 H2 H3 P UL OL LI STRONG EM B I U MARK TABLE THEAD TBODY TR TH TD BR'.split(' '));
function sanit(n){
 [...n.childNodes].forEach(c=>{
  if(c.nodeType===3)return;
  if(c.nodeType!==1||/^(SCRIPT|STYLE)$/.test(c.tagName)){c.remove();return}
  sanit(c);
  if(OK.has(c.tagName))[...c.attributes].forEach(a=>c.removeAttribute(a.name));
  else c.replaceWith(...c.childNodes);
 });
}
function clean(raw,imgs){
 raw=raw.replace(/^```(?:html)?\s*/i,'').replace(/```\s*$/,'');
 const d=new DOMParser().parseFromString('<body>'+raw+'</body>','text/html');
 sanit(d.body);
 let h=d.body.innerHTML.replace(/<p>\s*\[\[IMG(\d+)\]\]\s*<\/p>/g,(m,i)=>imgs[i]||'').replace(/\[\[IMG(\d+)\]\]/g,(m,i)=>imgs[i]||'');
 return h;
}
const toText=h=>{const d=document.createElement('div');d.innerHTML=h.replace(/<\/(p|li|h\d|tr|div)>/gi,'\n$&').replace(/<br\s*\/?>/gi,'\n');d.querySelectorAll('img').forEach(i=>i.remove());return d.textContent.replace(/\n{3,}/g,'\n\n').trim()};

/* format with AI */
$('#fmt').onclick=e=>busy(e.currentTarget,'Formatting...',async()=>{
 const tmp=$('#page').cloneNode(true),imgs=[];
 if(tmp.textContent.trim().length<20){toast('Write a few lines first.');return}
 const s=await ai();if(!s)return;
 tmp.querySelectorAll('img').forEach(im=>{imgs.push(im.outerHTML);const p=document.createElement('p');p.textContent='[[IMG'+(imgs.length-1)+']]';im.replaceWith(p)});
 const mode={tidy:'Tidy up: fix spelling and grammar, add headings, bullet lists and bold key terms, keep the original order.',outline:'Outline: restructure into a nested outline with headings and short bullets, keep the original order.',sheet:'Study sheet: organise by topic with headings, bullets, comparison tables where the notes compare things, and a Key terms list built only from terms already in the notes.'}[$('#fmode').value];
 const r=await s('You format a student\'s lecture notes.\nGoal: '+mode+'\nRules: keep every fact; never add facts that are not in the notes; wrap the 3-5 most testable points per section in <mark>; keep each [[IMGn]] marker as its own <p> where it is. Return only an HTML fragment using these tags: h1 h2 h3 p ul ol li strong em u mark table thead tbody tr th td br. No markdown, no code fences.\n\nNOTES:\n'+tmp.innerHTML.slice(0,40000),{cache:false});
 const h=clean(r.text,imgs);
 if(h.replace(/<[^>]+>/g,'').trim().length<10){toast('The AI returned nothing usable. Try again.');return}
 prevHTML=$('#page').innerHTML;$('#page').innerHTML=h;onEdit();$('#undoAi').hidden=false;toast('Formatted. Use Undo AI to restore your original.');
});
$('#undoAi').onclick=()=>{if(prevHTML==null)return;$('#page').innerHTML=prevHTML;prevHTML=null;$('#undoAi').hidden=true;onEdit()};

/* practice exam */
$('#gen').onclick=e=>busy(e.currentTarget,'Writing exam...',async()=>{
 let src=$('#allnotes').checked?notes.map(n=>(n.title||'Untitled')+'\n'+toText(n.html)).join('\n\n'):toText($('#page').innerHTML);
 src=src.slice(0,24000);
 if(src.length<80){toast('Add more notes first. The exam is built only from what you wrote.');return}
 const s=await ai();if(!s)return;
 const n=+$('#ecount').value,ty=$('#etype').value,df=$('#ediff').value;
 const tdesc={mixed:'about two thirds "mcq" and the rest "short"',mcq:'all "mcq"',short:'all "short"'}[ty];
 const ddesc={recall:'recall of definitions and facts',application:'applying the ideas to new scenarios',hard:'multi-step reasoning that combines several ideas'}[df];
 let arr=await s.json('Write a practice exam of exactly '+n+' questions, '+tdesc+', testing '+ddesc+'. Use ONLY information in the notes below. Return a JSON array. Each item: {"type":"mcq" or "short","q":"question text","options":["A","B","C","D"] (mcq only, exactly 4, no letter prefixes),"answer":index 0-3 for mcq, or a model answer string for short,"why":"one-sentence explanation"}. Return only JSON.\n\nNOTES:\n'+src,{cache:false});
 if(arr&&!Array.isArray(arr))arr=arr.questions||arr.items||[];
 exam=(arr||[]).filter(q=>q&&q.q&&(q.type==='short'||(Array.isArray(q.options)&&q.options.length>1))).map(q=>({...q,state:null}));
 if(!exam.length){toast('Could not build an exam from these notes. Try again.');return}
 renderExam();
});
function renderExam(){
 const box=$('#exam');box.innerHTML='';
 const done=exam.filter(q=>q.state!==null).length,right=exam.filter(q=>q.state===true).length;
 const sc=document.createElement('div');sc.className='score';sc.textContent='Score '+right+' / '+exam.length+(done<exam.length?'  ('+done+' answered)':'');box.appendChild(sc);
 exam.forEach((q,i)=>{
  const c=document.createElement('div');c.className='q';
  c.innerHTML='<p class="qt">'+(i+1)+'. '+esc(q.q)+'</p>';
  if(q.type==='short'){
   const ta=document.createElement('textarea');ta.rows=3;ta.placeholder='Your answer';ta.setAttribute('aria-label','Answer to question '+(i+1));c.appendChild(ta);
   if(q.state===null){
    const b=document.createElement('button');b.className='btn';b.style.marginTop='8px';b.textContent='Show answer';
    b.onclick=()=>{q.shown=true;q.draft=ta.value;renderExam()};c.appendChild(b);
    if(q.shown){ta.value=q.draft||'';b.remove();
     const w=document.createElement('p');w.className='why';w.innerHTML='<b>Model answer:</b> '+esc(q.answer)+'<br>'+esc(q.why||'');c.appendChild(w);
     const r=document.createElement('div');r.className='row';r.style.marginTop='8px';
     [['I got it',true],['I missed it',false]].forEach(([l,v])=>{const k=document.createElement('button');k.className='btn';k.textContent=l;k.onclick=()=>{q.state=v;renderExam()};r.appendChild(k)});
     c.appendChild(r)}
   }else{ta.value=q.draft||'';ta.disabled=true;const w=document.createElement('p');w.className='why';w.innerHTML='<b>'+(q.state?'Got it':'Missed')+'.</b> '+esc(q.answer)+'<br>'+esc(q.why||'');c.appendChild(w)}
  }else{
   q.options.forEach((o,j)=>{
    const b=document.createElement('button');b.className='opt';b.textContent=o;
    if(q.state!==null){b.disabled=true;if(j===+q.answer)b.classList.add('right');else if(j===q.pick)b.classList.add('wrong')}
    b.onclick=()=>{q.pick=j;q.state=(j===+q.answer);renderExam()};c.appendChild(b);
   });
   if(q.state!==null){const w=document.createElement('p');w.className='why';w.textContent=q.why||'';c.appendChild(w)}
  }
  box.appendChild(c);
 });
 const r=document.createElement('div');r.className='row';
 const sv=document.createElement('button');sv.className='btn';sv.textContent='Save as note';sv.onclick=saveExam;
 const rs=document.createElement('button');rs.className='btn';rs.textContent='Retake';rs.onclick=()=>{exam.forEach(q=>{q.state=null;q.shown=false;q.pick=null;q.draft=''});renderExam()};
 r.append(rs,sv);box.appendChild(r);
}
function saveExam(){
 let h='<h1>Practice exam</h1><ol>'+exam.map(q=>'<li><p>'+esc(q.q)+'</p>'+(q.type==='short'?'':'<ul>'+q.options.map(o=>'<li>'+esc(o)+'</li>').join('')+'</ul>')+'</li>').join('')+'</ol><h2>Answer key</h2><ol>'+exam.map(q=>'<li>'+(q.type==='short'?esc(q.answer):esc(q.options[+q.answer]||''))+'</li>').join('')+'</ol>';
 const n={id:uid(),title:'Practice exam',html:h,updated:Date.now()};notes.unshift(n);persist();openNote(n.id);view('write');push(n.id);toast('Saved as a new note.');
}

/* handwriting */
const cv=$('#cv'),cx=cv.getContext('2d');
let pen='#17222D',erase=false,drawing=false,last=null,stack=[],inked=false,hlm=false,hpts=[];
function hlRedraw(){const b=stack[stack.length-1];cx.save();cx.setTransform(1,0,0,1,0,0);cx.putImageData(b,0,0);cx.restore();cx.globalCompositeOperation='source-over';cx.globalAlpha=.35;cx.strokeStyle=pen;cx.lineWidth=16;cx.beginPath();hpts.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));if(hpts.length===1)cx.lineTo(hpts[0][0]+.01,hpts[0][1]);cx.stroke();cx.globalAlpha=1}
function openDraw(){
 $('#draw').hidden=false;
 const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
 cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);
 cx.setTransform(d,0,0,d,0,0);cx.lineCap='round';cx.lineJoin='round';stack=[];inked=false;cv.className=$('#ptpl').value;
}
const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{
 cv.setPointerCapture(e.pointerId);drawing=true;last=pt(e);
 stack.push(cx.getImageData(0,0,cv.width,cv.height));if(stack.length>15)stack.shift();
 if(hlm){hpts=[last];hlRedraw()}else seg(last,last,e.pressure);inked=true;
});
cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pt(e);if(hlm){hpts.push(p);hlRedraw()}else seg(last,p,e.pressure);last=p});
['pointerup','pointercancel'].forEach(k=>cv.addEventListener(k,()=>drawing=false));
function seg(a,b,pr){
 cx.globalCompositeOperation=erase?'destination-out':'source-over';
 cx.strokeStyle=pen;cx.lineWidth=erase?20:(+$('#psize').value)*(.7+(pr||.5)*.6);
 cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0]+.01,b[1]);cx.stroke();
}
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{pen=b.dataset.c;erase=false;$('#eraser').setAttribute('aria-pressed','false');document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===b))});
$('#eraser').onclick=e=>{erase=!erase;if(erase){hlm=false;$('#hl').style.background='';$('#hl').style.color=''}e.currentTarget.setAttribute('aria-pressed',erase);e.currentTarget.style.background=erase?'var(--mark)':'';e.currentTarget.style.color=erase?'#17222D':''};
$('#dundo').onclick=()=>{const s=stack.pop();if(s){cx.save();cx.setTransform(1,0,0,1,0,0);cx.putImageData(s,0,0);cx.restore()}};
$('#dclear').onclick=()=>{cx.save();cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);cx.restore();stack=[];inked=false};
$('#dclose').onclick=()=>$('#draw').hidden=true;
function flat(){const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(cv,0,0);return c}
$('#dins').onclick=()=>{
 if(!inked){toast('Draw something first.');return}
 const c=flat(),w=Math.min(900,c.width),o=document.createElement('canvas');o.width=w;o.height=Math.round(c.height*w/c.width);o.getContext('2d').drawImage(c,0,0,o.width,o.height);
 insertHTML('<img src="'+o.toDataURL('image/png')+'" alt="Handwritten note"><p><br></p>');$('#draw').hidden=true;
};
function transcribe(blob,btn){
 return busy(btn,'Reading...',async()=>{
  const s=await ai();if(!s)return;
  if(!canImg){toast('Reading handwriting is not available here.');return}
  const r=await s('Transcribe the handwriting in this image exactly as written. Keep line breaks, lists and underlined headings (use h2 for headings, ul/li for bullets, p for lines). Fix nothing and add nothing. Write [?] for any word you cannot read. Return only an HTML fragment, no code fences.',{images:[blob],cache:false});
  const h=clean(r.text,[]);
  if(h.replace(/<[^>]+>/g,'').trim().length<2){toast('No handwriting found in that image.');return}
  insertHTML(h);$('#draw').hidden=true;view('write');toast('Inserted. Check any [?] marks.');
 });
}
$('#dtr').onclick=e=>{
 if(!inked){toast('Write something first.');return}
 flat().toBlob(b=>transcribe(b,$('#dtr')),'image/png');
};
$('#photo').onchange=e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 const img=new Image(),u=URL.createObjectURL(f);
 img.onload=()=>{
  const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
  c.toBlob(b=>{toast('Reading your photo...');transcribe(b,$('#fmt'))},'image/jpeg',.85);
 };
 img.src=u;
};

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>view(b.dataset.v));
/* cross-device sync (private to the signed-in viewer) */
let col=null,first=true;const pushT={},inflight={};
const setSync=m=>{const e=$('#sync');if(e)e.textContent=m};
function push(id){if(!col)return;clearTimeout(pushT[id]);pushT[id]=setTimeout(()=>flush(id),900)}
async function flush(id){
 if(!col)return;
 if(inflight[id]){push(id);return}
 const n=notes.find(x=>x.id===id);if(!n||!n.updated)return;
 const body={title:n.title||'',html:n.html,updated:n.updated,paper:n.paper||'',folder:n.folder||''};
 if(JSON.stringify(body).length>240000){setSync('One note is too large to sync. Shrink or remove a drawing.');return}
 inflight[id]=true;
 try{await col.doc(id).set(body);setSync('Synced across your devices')}
 catch(e){const c=e&&e.code;setSync(c==='quota_exceeded'?'Cloud storage is full. Delete old notes to keep syncing.':c==='invalid_argument'?'Your account cannot sync on this page.':'Sync paused. It retries on your next edit.');if(c==='revoked')col=null}
 inflight[id]=false;
}
async function initSync(){
 setSync('Notes are saved on this device only.');
 let db=null,user=null;
 try{if(window.claude){db=await claude.use('db');user=await claude.use('user')}}catch(e){}
 const uidv=user?await user.id().catch(()=>null):null;
 if(!db||!uidv)return;
 setSync('Syncing...');
 col=db.collection('data/users/'+uidv);
 col.onSnapshot(snap=>{
  let changed=false;const cloud={};
  snap.docs.forEach(d=>{cloud[d.id]=d.data()||{}});
  if(first&&snap.size>0){const b=notes.length;notes=notes.filter(n=>!(n.id==='welcome'&&!n.updated));if(notes.length!==b)changed=true}
  snap.docChanges().forEach(c=>{
   const d=c.doc.data()||{},id=c.doc.id,i=notes.findIndex(n=>n.id===id);
   if(c.type==='removed'){if(i>-1){notes.splice(i,1);changed=true}return}
   if(id===cur&&document.activeElement===$('#page'))return;
   const nn={id,title:d.title||'',html:d.html||'',updated:d.updated||0,paper:d.paper||'',folder:d.folder||''};
   if(i<0){notes.push(nn);changed=true}else if(nn.updated>notes[i].updated){notes[i]=nn;changed=true}
  });
  if(first){notes.forEach(n=>{const c=cloud[n.id];if(n.updated&&(!c||n.updated>(c.updated||0)))push(n.id)});first=false}
  if(!notes.length)notes=[{id:uid(),title:'',html:'',updated:Date.now()}];
  if(!notes.some(n=>n.id===cur)){cur=notes[0].id;changed=true}
  if(changed){
   persist();const n=get();
   if(document.activeElement!==$('#page')&&(n.html!==$('#page').innerHTML||n.title!==$('#title').value))openNote(cur);else list();
  }
  setSync('Synced across your devices');
 },()=>setSync('Sync unavailable right now. Notes are still saved on this device.'));
}
/* notebooks, search, paper, highlighter, image, flashcards */
function folders(){const s=[...new Set(notes.map(n=>n.folder).filter(Boolean))].sort(),f=$('#fold'),v=f.value;f.innerHTML='<option value="">All notebooks</option>'+s.map(x=>'<option>'+esc(x)+'</option>').join('');f.value=s.includes(v)?v:'';$('#flist').innerHTML=s.map(x=>'<option value="'+esc(x)+'">').join('')}
function vis(n){const q=$('#q').value.trim().toLowerCase(),f=$('#fold').value;return(!f||(n.folder||'')===f)&&(!q||(n.title+' '+toText(n.html)).toLowerCase().includes(q))}
function applyPaper(){const p=get().paper||'';$('#page').className=p;$('#paper').value=p}
$('#q').oninput=list;$('#fold').onchange=list;
$('#folder').addEventListener('change',()=>{get().folder=$('#folder').value.trim();onEdit()});
$('#hl').onclick=e=>{hlm=!hlm;if(hlm){erase=false;$('#eraser').style.background='';if(pen==='#17222D'){pen='#FFD60A';document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x.dataset.c===pen))}}e.currentTarget.style.background=hlm?'var(--mark)':'';e.currentTarget.style.color=hlm?'#17222D':''};
$('#ptpl').onchange=e=>cv.className=e.target.value;
$('#imgfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);insertHTML('<img src="'+c.toDataURL('image/jpeg',.8)+'" alt="Inserted image"><p><br></p>')};im.src=u};
let deck=[],flip=false,deckDone=false;
$('#fgen').onclick=e=>busy(e.currentTarget,'Making cards...',async()=>{
 const src=toText($('#page').innerHTML).slice(0,24000);
 if(src.length<60){toast('Write a few lines first.');return}
 const s=await ai();if(!s)return;
 let a=await s.json('Make 10 to 20 flashcards from these notes. Use ONLY information in the notes. Return a JSON array of {"front":"short prompt","back":"concise answer"}. Return only JSON.\n\nNOTES:\n'+src,{cache:false});
 if(a&&!Array.isArray(a))a=a.cards||[];
 deck=(a||[]).filter(c=>c&&c.front&&c.back);
 if(!deck.length){toast('Could not make cards. Try again.');return}
 flip=false;deckDone=false;renderDeck();
});
function renderDeck(){
 const b=$('#deck');
 if(!deck.length){b.innerHTML=deckDone?'<p class="why">All cards done.</p>':'';return}
 const c=deck[0];
 b.innerHTML='<div class="q" id="card" tabindex="0" role="button" aria-label="Flip card" style="min-height:110px;cursor:pointer"><p class="qt">'+esc(flip?c.back:c.front)+'</p><p class="why">'+(flip?'Answer':'Tap to flip')+', '+deck.length+' left</p></div>'+(flip?'<div class="row"><button class="btn" id="again">Again</button><button class="btn pri" id="knew">Knew it</button></div>':'');
 const k=$('#card');k.onclick=()=>{flip=!flip;renderDeck()};k.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();k.onclick()}};
 if(flip){$('#again').onclick=()=>{deck.push(deck.shift());flip=false;renderDeck()};$('#knew').onclick=()=>{deck.shift();flip=false;deckDone=!deck.length;renderDeck()}}
}
load();openNote(cur);initSync();
</script>
